name: CI

# Runs on every pull request and on main: rustfmt, clippy, the tests with the
# vectors and the rpc table of nginxui/plugin-spec next to this repository,
# the docs, and a check that src/pb still matches the proto contract. The
# vectors and the alignment tests read the spec checkout, so a change of the
# contract turns this red until `cargo xtask generate` is run here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Makes the tests fail instead of skipping when the spec is missing.
  REQUIRE_SPEC: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-sdk-rust

      # The tests look for the spec checkout next to this repository.
      - uses: actions/checkout@v4
        with:
          repository: nginxui/plugin-spec
          path: plugin-spec

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-sdk-rust

      - name: rustfmt
        working-directory: plugin-sdk-rust
        run: cargo fmt --all --check

      - name: clippy
        working-directory: plugin-sdk-rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        working-directory: plugin-sdk-rust
        run: cargo test --workspace

      - name: doc
        working-directory: plugin-sdk-rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

  contract:
    name: src/pb matches nginxui/plugin-spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-sdk-rust

      # The generator looks for the spec checkout next to this repository.
      - uses: actions/checkout@v4
        with:
          repository: nginxui/plugin-spec
          path: plugin-spec

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-sdk-rust

      - name: cargo xtask generate --check
        working-directory: plugin-sdk-rust
        run: cargo xtask generate --check

  msrv:
    name: build with the minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nginxui-plugin-sdk --locked
