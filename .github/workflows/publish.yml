name: Publish

# Publishes nginxui-plugin-sdk to crates.io when a version tag is pushed. The
# tag must match Cargo.toml, e.g. v0.1.0 for version = "0.1.0". crates.io
# authenticates through trusted publishing (OIDC) bound to this workflow and
# the "crates-io" environment, so no long lived token is stored. The
# environment can require a reviewer before anything is published, since a
# crates.io version cannot be deleted, only yanked.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nginxui-plugin-sdk") | .version')
          if [ "${tag}" != "${version}" ]; then
            echo "tag v${tag} does not match Cargo.toml version ${version}"
            exit 1
          fi

      # A version published by hand, such as the first one, is left alone.
      - name: Check whether the version is already on crates.io
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "nginxui-plugin-sdk publish workflow" \
            "https://crates.io/api/v1/crates/nginxui-plugin-sdk/${GITHUB_REF_NAME#v}")
          echo "published=$([ "${code}" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.exists.outputs.published != 'true'
        id: auth

      # Builds the packaged crate from its tarball before uploading it.
      - run: cargo publish --locked -p nginxui-plugin-sdk
        if: steps.exists.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
